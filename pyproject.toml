[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-AutoSpaceShooterCore"
version = "0.1.0"
description = "Núcleo reutilizável para bots de shooters verticais: desviar de projéteis e abater inimigos."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "João Guilherme Matzenbacher" }]
dependencies = ["numpy>=1.24", "opencv-python>=4.8"]

[tool.setuptools]
packages = ["shooter_core"]
